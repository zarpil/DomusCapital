server {
    listen 18492;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para máximo rendimiento y velocidad
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caché optimizada para recursos estáticos
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Soporte para URLs limpias (ej: /reformas carga reformas.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Página de error 404 personalizada redirigiendo al inicio
    error_page 404 /index.html;
}
