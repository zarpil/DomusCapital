services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      # Puerto interno para que Coolify lo enrute por su proxy, sin reservar un puerto del host.
      - "18492"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18492/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
