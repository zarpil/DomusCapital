services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Acceso directo por http://IP_DEL_SERVIDOR:18492 y disponible para el proxy de Coolify.
      - "18492:18492"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18492/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
